[+]
build_type=Release
build_target=main
build_dir=build
build_generator=Visual Studio 18 2026
build_platform=x64
run_environ=
run_target="$(VIM_ROOT)\$(VIM:build_dir)\$(VIM:build_type)\$(VIM:build_target).exe"
build_options=
build_configs=
vs_instance_id=d26b62b8
vs_arch=amd64
vs_host_arch=amd64
vs_devshell_module=F:\Softwares\Visual Studio\18\BuildTools\Common7\Tools\Microsoft.VisualStudio.DevShell.dll
ps_quickfix_preamble=[Console]::InputEncoding=[Console]::OutputEncoding=[System.Text.UTF8Encoding]::new($false); $OutputEncoding=[Console]::OutputEncoding;
vs_devshell=Import-Module '$(VIM:vs_devshell_module)'; Enter-VsDevShell -VsInstanceId $(VIM:vs_instance_id) -Arch $(VIM:vs_arch) -HostArch $(VIM:vs_host_arch) | Out-Null;

[project-build]
command=Write-Host "project building"
command:c,cpp=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) $(VIM:vs_devshell) cmake -S '$(VIM_ROOT)' -G '$(VIM:build_generator)' -A '$(VIM:build_platform)' -B '$(VIM:build_dir)' -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON $(VIM:build_configs); if ($LASTEXITCODE -eq 0) { cmake --build '$(VIM:build_dir)' --target '$(VIM:build_target)' --config '$(VIM:build_type)' $(VIM:build_options) }"
command:rust=cargo build
output=quickfix
cwd=$(VIM_ROOT)
save=2

[project-run]
command=Write-Host "project running"
command:c,cpp=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) & '$(VIM:run_target)'"
command:rust=cargo run
output=quickfix-raw
cwd=$(VIM_ROOT)
save=2

[project-config]
command=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) $(VIM:vs_devshell) cmake -S '$(VIM_ROOT)' -G '$(VIM:build_generator)' -A '$(VIM:build_platform)' -B '$(VIM:build_dir)' -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON $(VIM:build_configs)"
output=quickfix
cwd=$(VIM_ROOT)
save=2

[project-clean]
command=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) if (Test-Path '$(VIM:build_dir)') { Remove-Item -Recurse -Force '$(VIM:build_dir)' }"
output=quickfix-raw
cwd=$(VIM_ROOT)
save=2

[file-build]
command=Write-Host "building"
command:rust=rustc "$(VIM_FILEPATH)"
command:c=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) $(VIM:vs_devshell) cl /nologo /W4 /TC /Fe:'$(VIM_PATHNOEXT).exe' '$(VIM_FILEPATH)'"
command:cpp=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) $(VIM:vs_devshell) cl /nologo /W4 /EHsc /std:c++20 /Fe:'$(VIM_PATHNOEXT).exe' '$(VIM_FILEPATH)'"
command:make=make -f "$(VIM_FILEPATH)"
output=quickfix
cwd=$(VIM_FILEDIR)
save=2

[file-run]
command=& "$(VIM_FILEPATH)"
command:rust=& "$(VIM_PATHNOEXT).exe"
command:c,cpp=chcp 65001>nul && powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "$(VIM:ps_quickfix_preamble) & '$(VIM_PATHNOEXT).exe'"
command:python=python "$(VIM_FILENAME)"
command:javascript=node "$(VIM_FILENAME)"
command:sh=bash "$(VIM_FILENAME)"
output=quickfix-raw
cwd=$(VIM_FILEDIR)
save=2
